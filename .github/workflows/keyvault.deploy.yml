name: Deploy KeyVault

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'dev/uat/prod'
        required: true
        type: choice
        options:
          - dev
          - uat
          - prod
        default: dev
      rgName:
        description: 'Target resource group name'
        required: true
        default: ''

jobs:
  deploy-keyvault:
    runs-on: ubuntu-latest
    env:
      # recommended: set PARAM_FILE via env so it's available to all steps
      PARAM_FILE: infra/parameters/keyvault.${{ github.event.inputs.environment }}.parameters.json

    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Azure CLI & Bicep
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ca-certificates curl apt-transport-https lsb-release gnupg
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          az bicep install || true

      - name: Show chosen params
        run: |
          echo "Using parameter file: $PARAM_FILE"
          echo "Contents preview:"
          sed -n '1,120p' "$PARAM_FILE" || true

      - name: Deploy KeyVault into RG
        run: |
          RG="${{ github.event.inputs.rgName }}"
          if [ -z "$RG" ]; then
            echo "Error: rgName input is required"
            exit 1
          fi

          az deployment group create \
            --resource-group "$RG" \
            --template-file infra/modules/keyvault.bicep \
            --parameters @"$PARAM_FILE" \
            --only-show-errors
